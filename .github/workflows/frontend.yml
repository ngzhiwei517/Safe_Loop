name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      BACKEND_URL: http://127.0.0.1:8000
      SITE_TIMEZONE: Asia/Singapore
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ../backend/requirements.txt
      - name: Start state-machine API
        run: |
          python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/safeloop-backend.log" 2>&1 &
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/state-machine", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run tsc
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: stub
      APP_ENV: test
      ALLOW_DEBUG_AUTH: "false"
      BACKEND_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      SITE_TIMEZONE: Asia/Singapore
      FRONTEND_ORIGINS: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Install application dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci --prefer-offline --no-audit
      - name: Start isolated Supabase service containers
        run: |
          supabase start
          supabase db reset --local
      - name: Export local Supabase settings
        shell: bash
        run: |
          set -euo pipefail
          source <(supabase status -o env)
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          if [ -n "${JWT_SECRET:-}" ]; then echo "::add-mask::$JWT_SECRET"; fi
          {
            echo "DATABASE_URL=$DB_URL"
            echo "TEST_DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET:-}"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/safeloop-e2e-backend.log" 2>&1 &
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for attempt in range(60):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run complete SafeLoop browser loop
        run: npm --prefix frontend run test:e2e
      - name: Show backend log on failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/safeloop-e2e-backend.log" || cat "$RUNNER_TEMP/safeloop-e2e-backend.log"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safeloop-playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
