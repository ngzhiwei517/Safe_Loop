name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      BACKEND_URL: http://127.0.0.1:8000
      SITE_TIMEZONE: Asia/Singapore
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ../backend/requirements.txt
      - name: Start state-machine API
        run: |
          python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/safeloop-backend.log" 2>&1 &
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/state-machine", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run tsc
      - run: npm run test
